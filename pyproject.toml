[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2zh-layout"
version = "0.1.0"
description = "Translate English or Spanish PDFs to Chinese while preserving visual layout."
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.26", "Pillow>=11", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf2zh = "pdf2zh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
